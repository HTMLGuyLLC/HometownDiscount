name: release

# Pushing a tag like v0.1.1 builds the archives and opens a draft release.
# Nothing is public until the draft is published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --draft --title "$GITHUB_REF_NAME" --generate-notes
