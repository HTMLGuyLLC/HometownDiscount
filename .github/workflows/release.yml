name: release

# Pushing a tag like v0.2.0 builds the archives, records signed build
# provenance for them, and opens a draft release. Nothing is public until the
# draft is published by hand. Actions are pinned to exact commits.
on:
  push:
    tags: ['v*']

permissions:
  contents: write     # create the draft release
  id-token: write     # sign the provenance
  attestations: write # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3: $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Build archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --draft --title "$GITHUB_REF_NAME" --generate-notes
