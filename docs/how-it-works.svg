<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
  <title id="t">How Hometown Discount works</title>
  <desc id="d">Step 1, Claude does a task, like finding where a function is defined. Step 2, your local AI model redoes it on your computer, checked against the right answer. Step 3, once it's proven, your local model takes that kind of task over, saving Claude for the hard work.</desc>
  <style>
    text{font-family:"Schibsted Grotesk",-apple-system,"Segoe UI",system-ui,sans-serif}
    .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#46504a"/></marker>
  </defs>
  <rect width="800" height="450" fill="#121614"/>

  <!-- 1 · Claude does a task -->
  <rect x="32" y="60" width="222" height="330" rx="14" fill="#191e1b" stroke="#2a312d"/>
  <text x="56" y="100" class="mono" font-size="14" font-weight="700" fill="#e2bf6c">1</text>
  <circle cx="143" cy="190" r="54" fill="#2b2412" stroke="#e2bf6c" stroke-width="2"/>
  <path d="M119 196 a16 16 0 0 1 6-30 a22 22 0 0 1 40 6 a14 14 0 0 1 -2 28z" fill="#e2bf6c"/>
  <text x="143" y="290" text-anchor="middle" font-size="20" font-weight="800" fill="#e7ece9">Claude does</text>
  <text x="143" y="316" text-anchor="middle" font-size="20" font-weight="800" fill="#e7ece9">a task</text>
  <text x="143" y="348" text-anchor="middle" font-size="14" fill="#8b968f">like finding where a</text>
  <text x="143" y="367" text-anchor="middle" font-size="14" fill="#8b968f">function is defined</text>
  <path d="M262 225 L 282 225" stroke="#46504a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2 · Your local AI model redoes it -->
  <rect x="289" y="60" width="222" height="330" rx="14" fill="#191e1b" stroke="#2a312d"/>
  <text x="313" y="100" class="mono" font-size="14" font-weight="700" fill="#b8c1bc">2</text>
  <rect x="342" y="150" width="56" height="74" rx="6" fill="#191e1b" stroke="#e7ece9"/>
  <rect x="402" y="150" width="56" height="74" rx="6" fill="#0f2a1c" stroke="#7fc39c"/>
  <path d="M352 170h36M352 184h36M352 198h24" stroke="#e7ece9" stroke-width="3"/>
  <path d="M412 170h36M412 184h36M412 198h24" stroke="#7fc39c" stroke-width="3"/>
  <text x="400" y="248" text-anchor="middle" font-size="22" font-weight="800" fill="#e7ece9">=</text>
  <text x="400" y="290" text-anchor="middle" font-size="20" font-weight="800" fill="#e7ece9">Your local AI</text>
  <text x="400" y="316" text-anchor="middle" font-size="20" font-weight="800" fill="#e7ece9">model redoes it</text>
  <text x="400" y="348" text-anchor="middle" font-size="14" fill="#8b968f">on your computer, checked</text>
  <text x="400" y="367" text-anchor="middle" font-size="14" fill="#8b968f">against the right answer</text>
  <path d="M519 225 L 539 225" stroke="#46504a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3 · Your local model takes it over -->
  <rect x="546" y="60" width="222" height="330" rx="14" fill="#0f2a1c" stroke="#7fc39c" stroke-width="2"/>
  <text x="570" y="100" class="mono" font-size="14" font-weight="700" fill="#7fc39c">3</text>
  <rect x="613" y="160" width="88" height="56" rx="6" fill="#121614" stroke="#7fc39c" stroke-width="2"/>
  <path d="M599 224h116l-10 12h-96z" fill="#7fc39c"/>
  <path d="M641 188l10 10 18-20" stroke="#7fc39c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="657" y="290" text-anchor="middle" font-size="20" font-weight="800" fill="#7fc39c">Your local model</text>
  <text x="657" y="316" text-anchor="middle" font-size="20" font-weight="800" fill="#7fc39c">takes it over</text>
  <text x="657" y="348" text-anchor="middle" font-size="14" fill="#b8c1bc">once it's proven, saving</text>
  <text x="657" y="367" text-anchor="middle" font-size="14" fill="#b8c1bc">Claude for the hard work</text>
</svg>
