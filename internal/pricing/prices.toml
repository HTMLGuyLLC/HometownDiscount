# API prices in USD per million tokens, used to put a dollar value on usage.
# Subscription users don't pay per token; these are "API-equivalent" values.
# Source: Anthropic API pricing as of 2026-10-06. Update this file when prices change.
#
# Cache writes are derived from the input price: 1.25x for the 5-minute cache,
# 2x for the 1-hour cache. Cache reads differ by model, so they're listed.
# fast_multiplier applies to requests that ran in fast mode.
# long_* prices apply when a request's prompt is longer than long_threshold tokens.

